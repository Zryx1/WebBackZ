<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirim ke Panel</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
  form{background:#1e293b;padding:24px;border-radius:12px;width:100%;max-width:380px;display:grid;gap:12px}
  input,textarea,button{padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font:inherit}
  button{background:#2563eb;border:0;cursor:pointer;font-weight:600}
  #status{min-height:1.2em;font-size:.9rem}
</style>
</head>
<body>
<form id="f">
  <h2 style="margin:0">Kirim ke Panel</h2>
  <input id="backend" placeholder="Alamat backend" value="http://erine.jkt48node.id:3530" required>
  <input id="name" placeholder="Nama" required>
  <textarea id="message" placeholder="Pesan" rows="3" required></textarea>
  <button>Kirim</button>
  <div id="status"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const s = document.getElementById("status");
  s.textContent = "Mengirim...";
  try {
    const r = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        backend: document.getElementById("backend").value.trim(),
        name: document.getElementById("name").value,
        message: document.getElementById("message").value
      })
    });
    const d = await r.json();
    s.textContent = d.ok ? "Terkirim, cek console panel." : "Gagal: " + (d.error || r.status);
  } catch (err) {
    s.textContent = "Gagal terhubung.";
  }
});
</script>
</body>
</html>
