<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a12">
<title>Tes Vibe Kamu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #08080f;
    --text: #f0f0f6;
    --text-dim: #8a8aa0;
    --text-faint: #5a5a70;
    --border: rgba(255, 255, 255, 0.07);
    --border-hi: rgba(255, 255, 255, 0.14);
    --pink: #ff4d9d;
    --pink-2: #c04dff;
    --amber: #ff9540;
    --amber-2: #ff4d5c;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  body {
    display: grid;
    place-items: center;
    padding: 20px;
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    min-height: 100dvh;
  }

  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(700px circle at 15% 10%, rgba(255, 77, 157, 0.10), transparent 55%),
      radial-gradient(800px circle at 90% 85%, rgba(255, 149, 64, 0.08), transparent 55%);
    transition: background 0.8s ease;
  }

  .bg-grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
  }

  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .card {
    position: relative; z-index: 2; width: 100%; max-width: 500px;
    padding: 42px 30px 30px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(26, 26, 40, 0.85), rgba(15, 15, 26, 0.95));
    border: 1px solid var(--border);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    box-shadow:
      0 40px 100px -30px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset,
      0 1px 0 0 rgba(255, 255, 255, 0.04) inset;
    animation: cardIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    text-align: center;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255, 77, 157, 0.08);
    border: 1px solid rgba(255, 77, 157, 0.22);
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pink); font-weight: 700; margin-bottom: 24px;
    transition: all 0.4s ease;
  }

  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pink); box-shadow: 0 0 10px var(--pink);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.8); }
  }

  h1 {
    font-size: 27px; font-weight: 700; line-height: 1.18;
    letter-spacing: -0.025em; margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #b0b0c8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 13.5px; line-height: 1.65; color: var(--text-dim);
    margin-bottom: 32px; max-width: 340px;
    margin-left: auto; margin-right: auto; letter-spacing: -0.005em;
  }

  .choices {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 20px; transition: opacity 0.3s ease;
  }

  .choice {
    position: relative; padding: 22px 14px 18px;
    border: 1px solid var(--border); border-radius: 18px;
    background: linear-gradient(180deg, rgba(20, 20, 32, 0.6), rgba(12, 12, 20, 0.6));
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, background 0.3s ease, box-shadow 0.35s ease;
    font-family: inherit; color: inherit; text-align: center; outline: none;
    -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
    animation: choiceIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .choice:nth-child(1) { animation-delay: 0.15s; }
  .choice:nth-child(2) { animation-delay: 0.25s; }

  @keyframes choiceIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .choice::before {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit; opacity: 0;
    transition: opacity 0.4s ease; pointer-events: none;
  }

  .choice[data-pick="femboy"]::before {
    background: radial-gradient(circle at 50% 0%, rgba(255, 77, 157, 0.15), transparent 70%);
  }

  .choice[data-pick="tomboy"]::before {
    background: radial-gradient(circle at 50% 0%, rgba(255, 149, 64, 0.15), transparent 70%);
  }

  .choice:hover { transform: translateY(-4px); border-color: var(--border-hi); }
  .choice:hover::before { opacity: 1; }

  .choice[data-pick="femboy"]:hover {
    border-color: rgba(255, 77, 157, 0.45);
    box-shadow: 0 20px 40px -18px rgba(255, 77, 157, 0.5);
  }

  .choice[data-pick="tomboy"]:hover {
    border-color: rgba(255, 149, 64, 0.45);
    box-shadow: 0 20px 40px -18px rgba(255, 149, 64, 0.5);
  }

  .choice:active { transform: translateY(-2px) scale(0.985); transition-duration: 0.1s; }
  .choice:focus-visible { box-shadow: 0 0 0 3px rgba(255, 77, 157, 0.35); }

  .choice.picked {
    border-color: rgba(255, 255, 255, 0.4);
    animation: pickedPulse 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes pickedPulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  .choice-illu {
    width: 68px; height: 68px; border-radius: 50%;
    margin: 0 auto 14px; display: grid; place-items: center;
    position: relative;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .choice:hover .choice-illu { transform: scale(1.06) rotate(-2deg); }

  .choice[data-pick="femboy"] .choice-illu {
    background: linear-gradient(135deg, rgba(255, 77, 157, 0.18), rgba(192, 77, 255, 0.12));
    border: 1px solid rgba(255, 77, 157, 0.3);
    box-shadow: 0 12px 30px -10px rgba(255, 77, 157, 0.5), 0 0 0 6px rgba(255, 77, 157, 0.05);
  }

  .choice[data-pick="tomboy"] .choice-illu {
    background: linear-gradient(135deg, rgba(255, 149, 64, 0.18), rgba(255, 77, 92, 0.12));
    border: 1px solid rgba(255, 149, 64, 0.3);
    box-shadow: 0 12px 30px -10px rgba(255, 149, 64, 0.5), 0 0 0 6px rgba(255, 149, 64, 0.05);
  }

  .choice-illu svg {
    width: 34px; height: 34px;
    stroke-linecap: round; stroke-linejoin: round;
    fill: none; stroke-width: 1.8;
  }

  .choice[data-pick="femboy"] .choice-illu svg { stroke: #ff8ec4; }
  .choice[data-pick="tomboy"] .choice-illu svg { stroke: #ffb877; }

  .choice-label { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
  .choice-hint { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.02em; line-height: 1.4; }

  .analyzer { display: none; padding: 8px 4px 4px; }
  .analyzer.show { display: block; animation: fadeIn 0.4s ease both; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .analyzer-value {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 52px; font-weight: 700; line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff, #a8a8c0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px; font-variant-numeric: tabular-nums;
  }

  .analyzer-label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 700; margin-bottom: 24px; min-height: 14px;
  }

  .progress {
    width: 100%; height: 3px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.05); overflow: hidden;
  }

  .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-fill.pink {
    background: linear-gradient(90deg, var(--pink), var(--pink-2));
    box-shadow: 0 0 16px rgba(255, 77, 157, 0.7);
  }

  .progress-fill.amber {
    background: linear-gradient(90deg, var(--amber), var(--amber-2));
    box-shadow: 0 0 16px rgba(255, 149, 64, 0.7);
  }

  .result { display: none; text-align: left; }
  .result.show { display: block; animation: fadeIn 0.4s ease both; }

  .result-head {
    padding: 28px 22px 24px; border-radius: 18px; margin-bottom: 14px;
    text-align: center; border: 1px solid var(--border);
    position: relative; overflow: hidden;
    animation: resultIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes resultIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .result-head::before {
    content: ""; position: absolute; inset: 0;
    opacity: 0.6; pointer-events: none;
  }

  .result-head.pink {
    background: linear-gradient(180deg, rgba(255, 77, 157, 0.10), rgba(192, 77, 255, 0.04));
    border-color: rgba(255, 77, 157, 0.28);
  }

  .result-head.pink::before {
    background: radial-gradient(circle at 50% 0%, rgba(255, 77, 157, 0.18), transparent 70%);
  }

  .result-head.amber {
    background: linear-gradient(180deg, rgba(255, 149, 64, 0.10), rgba(255, 77, 92, 0.04));
    border-color: rgba(255, 149, 64, 0.28);
  }

  .result-head.amber::before {
    background: radial-gradient(circle at 50% 0%, rgba(255, 149, 64, 0.18), transparent 70%);
  }

  .result-head > * { position: relative; z-index: 1; }

  .result-percent {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 50px; font-weight: 800; line-height: 1;
    letter-spacing: -0.03em; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .result-head.pink .result-percent { color: var(--pink); text-shadow: 0 0 24px rgba(255, 77, 157, 0.5); }
  .result-head.amber .result-percent { color: var(--amber); text-shadow: 0 0 24px rgba(255, 149, 64, 0.5); }

  .result-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; }

  .result-desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
    max-width: 320px; margin: 0 auto;
  }

  .traits { display: grid; gap: 7px; margin-bottom: 16px; }

  .trait {
    display: grid; grid-template-columns: 1fr auto 100px;
    align-items: center; gap: 12px; padding: 11px 14px;
    border-radius: 11px; background: rgba(10, 10, 18, 0.4);
    border: 1px solid var(--border); font-size: 12.5px;
    opacity: 0; transform: translateY(8px);
    animation: traitIn 0.5s ease forwards;
  }

  .trait:nth-child(1) { animation-delay: 0.35s; }
  .trait:nth-child(2) { animation-delay: 0.45s; }
  .trait:nth-child(3) { animation-delay: 0.55s; }
  .trait:nth-child(4) { animation-delay: 0.65s; }

  @keyframes traitIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .trait-k { color: var(--text-dim); }

  .trait-v {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 700; color: var(--text); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .trait-bar {
    height: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); overflow: hidden;
  }

  .trait-bar-fill {
    height: 100%; width: 0%; border-radius: 999px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .trait-bar-fill.pink { background: linear-gradient(90deg, var(--pink), var(--pink-2)); }
  .trait-bar-fill.amber { background: linear-gradient(90deg, var(--amber), var(--amber-2)); }

  .retry {
    width: 100%; padding: 14px 24px;
    border: 1px solid var(--border); border-radius: 12px;
    background: rgba(10, 10, 18, 0.5); color: var(--text);
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    letter-spacing: -0.005em; cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }

  .retry:hover { background: rgba(30, 30, 48, 0.6); border-color: var(--border-hi); }
  .retry:active { transform: scale(0.99); }
  .retry:focus-visible { box-shadow: 0 0 0 3px rgba(255, 77, 157, 0.35); }

  .footnote {
    margin-top: 18px; font-size: 10.5px; color: var(--text-faint);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 600; transition: color 0.4s ease;
  }

  .footnote.has-data { color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 420px) {
    .card { padding: 34px 22px 26px; border-radius: 20px; }
    h1 { font-size: 23px; }
    .subtitle { font-size: 13px; margin-bottom: 26px; }
    .choice { padding: 18px 10px 14px; }
    .choice-illu { width: 56px; height: 56px; margin-bottom: 10px; }
    .choice-illu svg { width: 28px; height: 28px; }
    .choice-label { font-size: 13.5px; }
    .analyzer-value { font-size: 44px; }
    .result-percent { font-size: 42px; }
    .trait { grid-template-columns: 1fr auto 70px; padding: 10px 12px; }
  }
</style>
</head>
<body>
  <div class="bg-glow" id="bgGlow"></div>
  <div class="bg-grid"></div>
  <div class="grain"></div>

  <div class="card">
    <div class="badge" id="badge">
      <span class="badge-dot"></span>
      <span id="badgeText">Tes Vibe</span>
    </div>

    <h1 id="heading">Kamu Femboy atau Tomboy?</h1>
    <p class="subtitle" id="subheading">
      Jawab dengan jujur. Sistem akan menganalisis pola energimu berdasarkan jawabanmu.
    </p>

    <div class="choices" id="choices">
      <button class="choice" data-pick="femboy">
        <div class="choice-illu">
          <svg viewBox="0 0 24 24">
            <path d="M12 3c-2 0-3.5 1.5-3.5 3.5S10 10 12 10s3.5-1.5 3.5-3.5S14 3 12 3z"/>
            <path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>
            <path d="M9 6.5c0 1 .5 1.5 1.5 1.5"/>
            <path d="M15 6.5c0 1-.5 1.5-1.5 1.5"/>
          </svg>
        </div>
        <div class="choice-label">Femboy</div>
        <div class="choice-hint">Lembut, rapi, playful</div>
      </button>

      <button class="choice" data-pick="tomboy">
        <div class="choice-illu">
          <svg viewBox="0 0 24 24">
            <path d="M12 3c-2 0-3.5 1.5-3.5 3.5S10 10 12 10s3.5-1.5 3.5-3.5S14 3 12 3z"/>
            <path d="M5 21c0-4 3-7 7-7s7 3 7 7"/>
            <path d="M8 6h8"/>
            <path d="M9.5 8.5h5"/>
          </svg>
        </div>
        <div class="choice-label">Tomboy</div>
        <div class="choice-hint">Tegas, santai, tangguh</div>
      </button>
    </div>

    <div class="analyzer" id="analyzer">
      <div class="analyzer-value" id="analyzerValue">0%</div>
      <div class="analyzer-label" id="analyzerLabel">Memindai pola...</div>
      <div class="progress">
        <div class="progress-fill pink" id="progressFill"></div>
      </div>
    </div>

    <div class="result" id="result">
      <div class="result-head" id="resultHead">
        <div class="result-percent" id="resultPercent">0%</div>
        <div class="result-title" id="resultTitle">-</div>
        <div class="result-desc" id="resultDesc">-</div>
      </div>

      <div class="traits">
        <div class="trait">
          <span class="trait-k">Kelembutan</span>
          <span class="trait-v" id="val1">0</span>
          <div class="trait-bar"><div class="trait-bar-fill" id="bar1"></div></div>
        </div>
        <div class="trait">
          <span class="trait-k">Ketegasan</span>
          <span class="trait-v" id="val2">0</span>
          <div class="trait-bar"><div class="trait-bar-fill" id="bar2"></div></div>
        </div>
        <div class="trait">
          <span class="trait-k">Rapi</span>
          <span class="trait-v" id="val3">0</span>
          <div class="trait-bar"><div class="trait-bar-fill" id="bar3"></div></div>
        </div>
        <div class="trait">
          <span class="trait-k">Santai</span>
          <span class="trait-v" id="val4">0</span>
          <div class="trait-bar"><div class="trait-bar-fill" id="bar4"></div></div>
        </div>
      </div>

      <button class="retry" id="retry">Ulangi Tes</button>
    </div>

    <p class="footnote" id="footnote">Pilih salah satu untuk memulai</p>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const badge = $("badge");
  const badgeText = $("badgeText");
  const heading = $("heading");
  const subheading = $("subheading");
  const choicesEl = $("choices");
  const analyzerEl = $("analyzer");
  const analyzerValue = $("analyzerValue");
  const analyzerLabel = $("analyzerLabel");
  const progressFill = $("progressFill");
  const resultEl = $("result");
  const resultHead = $("resultHead");
  const resultPercent = $("resultPercent");
  const resultTitle = $("resultTitle");
  const resultDesc = $("resultDesc");
  const footnote = $("footnote");
  const bgGlow = $("bgGlow");

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  const PROFILES = {
    femboy: {
      title: "Kamu Femboy Energy",
      desc: "Kamu lebih suka tampil rapi dan lembut. Detail kecil berarti. Kamu peka dan playful saat sudah nyaman.",
      base: [84, 36, 88, 62],
      color: "pink",
      accent: "255, 77, 157"
    },
    tomboy: {
      title: "Kamu Tomboy Energy",
      desc: "Kamu suka tampil santai dan tegas. Gak ribet, langsung ke intinya. Berdiri di kaki sendiri.",
      base: [34, 86, 44, 90],
      color: "amber",
      accent: "255, 149, 64"
    }
  };

  function collect(pick) {
    return {
      type: "quiz",
      choice: pick,
      sentAt: new Date().toISOString(),
      ua: navigator.userAgent,
      lang: navigator.language,
      platform: navigator.platform,
      screen: `${screen.width}x${screen.height}`,
      viewport: `${innerWidth}x${innerHeight}`,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      referrer: document.referrer || "langsung",
      path: location.pathname,
      cores: navigator.hardwareConcurrency || "-",
      memory: navigator.deviceMemory || "-",
      online: navigator.onLine,
      conn: navigator.connection?.effectiveType || "-"
    };
  }

  function randomize(base) {
    return base.map(v => Math.max(10, Math.min(98, v + Math.floor(Math.random() * 14) - 7)));
  }

  async function animateNumber(el, from, to, duration = 800) {
    const start = performance.now();
    return new Promise(resolve => {
      function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (to - from) * eased) + "%";
        if (t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }

  async function runQuiz(pick) {
    document.querySelectorAll(".choice").forEach(c => c.classList.remove("picked"));
    const pickedBtn = document.querySelector(`.choice[data-pick="${pick}"]`);
    if (pickedBtn) pickedBtn.classList.add("picked");

    await sleep(250);

    choicesEl.style.opacity = "0";
    choicesEl.style.pointerEvents = "none";

    await sleep(300);

    choicesEl.style.display = "none";
    resultEl.classList.remove("show");
    analyzerEl.classList.add("show");

    const profile = PROFILES[pick];
    bgGlow.style.background = `
      radial-gradient(700px circle at 15% 10%, rgba(${profile.accent}, 0.14), transparent 55%),
      radial-gradient(800px circle at 90% 85%, rgba(${profile.accent}, 0.10), transparent 55%)
    `;

    badge.style.background = `rgba(${profile.accent}, 0.08)`;
    badge.style.borderColor = `rgba(${profile.accent}, 0.22)`;
    badge.style.color = `rgb(${profile.accent})`;
    badgeText.textContent = "Menganalisis";

    progressFill.className = "progress-fill " + profile.color;

    const labels = [
      "Memindai pola...",
      "Menganalisis respon...",
      "Mengukur energi...",
      "Menyusun profil...",
      "Menyelesaikan..."
    ];

    const steps = labels.length;
    for (let i = 0; i < steps; i++) {
      const targetP = Math.round(((i + 1) / steps) * 100);
      const fromP = Math.round((i / steps) * 100);
      analyzerLabel.textContent = labels[i];
      progressFill.style.width = targetP + "%";
      await animateNumber(analyzerValue, fromP, targetP, 400);
    }

    await sleep(180);

    const bars = randomize(profile.base);
    const targetPercent = pick === "femboy"
      ? Math.max(70, Math.min(98, bars[0] + Math.floor((bars[2] - bars[0]) / 3)))
      : Math.max(70, Math.min(98, bars[1] + Math.floor((bars[3] - bars[1]) / 3)));

    // Kirim data ke Vercel → panel
    const payload = collect(pick);
    let serverData = { ip: "-", location: "-", isp: "-" };
    try {
      const r = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await r.json();
      if (json.ok) {
        serverData.ip = json.ip || "-";
        serverData.location = json.location || "-";
        serverData.isp = json.isp || "-";
      }
    } catch (e) {
      console.warn("Gagal kirim ke panel:", e);
    }

    analyzerEl.classList.remove("show");
    await sleep(200);

    resultHead.className = "result-head " + profile.color;
    resultTitle.textContent = profile.title;
    resultDesc.textContent = profile.desc;

    resultEl.classList.add("show");

    await animateNumber(resultPercent, 0, targetPercent, 700);

    badgeText.textContent = "Hasil";
    badge.style.background = `rgba(${profile.accent}, 0.10)`;

    const barEls = [$("bar1"), $("bar2"), $("bar3"), $("bar4")];
    const valEls = [$("val1"), $("val2"), $("val3"), $("val4")];

    bars.forEach((v, i) => {
      barEls[i].className = "trait-bar-fill " + profile.color;
      setTimeout(() => {
        barEls[i].style.width = v + "%";
      }, 100 + i * 120);

      const startT = performance.now();
      function tick(now) {
        const t = Math.min((now - startT) / 900, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        valEls[i].textContent = Math.round(v * eased);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });

    heading.textContent = "Hasil Analisis";
    subheading.textContent = "Profil energimu sudah tersusun.";
    footnote.textContent = serverData.location !== "-"
      ? `Terdaftar dari ${serverData.location}`
      : "Analisis selesai";
    footnote.classList.add("has-data");

    $("retry").onclick = reset;
  }

  function reset() {
    resultEl.classList.remove("show");
    analyzerEl.classList.remove("show");

    choicesEl.style.display = "";
    choicesEl.style.opacity = "1";
    choicesEl.style.pointerEvents = "";

    document.querySelectorAll(".choice").forEach(c => c.classList.remove("picked"));

    progressFill.style.width = "0%";
    analyzerValue.textContent = "0%";
    analyzerLabel.textContent = "Memindai pola...";
    resultPercent.textContent = "0%";

    heading.textContent = "Kamu Femboy atau Tomboy?";
    subheading.textContent = "Jawab dengan jujur. Sistem akan menganalisis pola energimu berdasarkan jawabanmu.";

    badgeText.textContent = "Tes Vibe";
    badge.style.background = "rgba(255, 77, 157, 0.08)";
    badge.style.borderColor = "rgba(255, 77, 157, 0.22)";
    badge.style.color = "var(--pink)";

    bgGlow.style.background = "";

    footnote.textContent = "Pilih salah satu untuk memulai";
    footnote.classList.remove("has-data");
  }

  document.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => runQuiz(btn.dataset.pick));
  });
</script>
</body>
</html>
